name: habitlife-bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: habitlife-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run bot once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TG_IDS: ${{ secrets.ADMIN_TG_IDS }}
        run: node bot-runner.js
      - name: Commit DB state
        run: |
          git config user.name "habitlife-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/users.json data/state.json
          git diff --cached --quiet || git commit -m "bot state"
          git push
